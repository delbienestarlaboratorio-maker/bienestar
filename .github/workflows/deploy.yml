name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with OpenNext for Cloudflare
        run: npx @opennextjs/cloudflare build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Debug - List .open-next output
        run: |
          echo "=== .open-next/ structure ==="
          ls -la .open-next/ || echo "NO .open-next/ FOLDER"
          ls -la .open-next/.build/ 2>/dev/null || echo "NO .build/ SUBFOLDER"
          ls -la .open-next/worker.js 2>/dev/null || echo "NO worker.js"

      - name: Deploy to Cloudflare Workers
        run: npx opennextjs-cloudflare deploy 2>&1 || (echo "--- DEPLOY FAILED ---" && exit 1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG: debug
