name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with OpenNext for Cloudflare
        run: npx @opennextjs/cloudflare build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Prepare Pages assets (copy _worker.js for Advanced Mode)
        run: |
          echo "Copying worker.js to assets/_worker.js for Cloudflare Pages Advanced Mode..."
          cp .open-next/worker.js .open-next/assets/_worker.js
          echo "Worker file size: $(du -sh .open-next/assets/_worker.js)"
          echo "Total assets size: $(du -sh .open-next/assets/)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .open-next/assets --project-name=bienestar --branch=main
