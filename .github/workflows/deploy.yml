name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify wrangler config
        run: |
          echo "=== Wrangler config ==="
          cat wrangler.toml
          echo "=== Node version ==="
          node -v
          echo "=== Check OpenNext ==="
          npx opennextjs-cloudflare --version || true

      - name: Build Next.js app
        id: build_next
        run: npx next build > next-build.log 2>&1
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PRIVATE_STANDALONE: 'true'

      - name: Upload Build Log
        if: failure() && steps.build_next.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: next-build-log
          path: next-build.log

      - name: Bundle with OpenNext
        run: npx opennextjs-cloudflare build --skipBuild --skipWranglerConfigCheck
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          SKIP_WRANGLER_CONFIG_CHECK: 'yes'
          SKIP_NEXT_APP_BUILD: 'true'

      - name: Deploy to Cloudflare
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
