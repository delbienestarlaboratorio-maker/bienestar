# DISABLED - This workflow was causing race conditions with deploy.yml
# Both workflows were deploying to the same Cloudflare Pages project,
# causing CSS/JS asset mismatches and broken deployments.
# All deployment is now handled by deploy.yml

name: Deploy to Cloudflare Pages (DISABLED)

on:
  workflow_dispatch:  # Manual trigger only, no longer auto-runs on push

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install wrangler (required by @opennextjs/cloudflare)
        run: npm install -g wrangler

      - name: Build with OpenNext for Cloudflare
        run: npx @opennextjs/cloudflare build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .open-next/assets --project-name=laboratorio-bienestar --branch=main
